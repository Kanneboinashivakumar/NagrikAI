<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 130" width="100%" height="130" style="background: transparent;">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Capsule Background -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102820" stop-opacity="0.82" />
      <stop offset="50%" stop-color="#0B1C16" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#06120E" stop-opacity="0.88" />
    </linearGradient>

    <!-- Frosted Glass Specular Rim Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.75" />
      <stop offset="25%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.55" />
    </linearGradient>

    <!-- Vibrant Glassmorphic Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="30%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Top Gloss Reflection -->
    <linearGradient id="specularGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Depth Shadows -->
    <filter id="glassShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#10B981" flood-opacity="0.2" />
    </filter>

    <!-- Text Glow & Shadow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#059669" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#A7F3D0" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Glass -->
  <rect x="60" y="5" width="740" height="120" rx="28" fill="url(#ambientGlow)" />

  <!-- Glassmorphic Capsule -->
  <rect x="30" y="10" width="800" height="110" rx="24" fill="url(#glassBody)" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#glassShadow)" />

  <!-- Top Glass Highlight Reflection Arc -->
  <path d="M 54 11 L 806 11 Q 829 11 829 34 L 829 55 Q 430 35 31 55 L 31 34 Q 31 11 54 11 Z" fill="url(#specularGleam)" />

  <!-- Clean NAGRIKAI Typography -->
  <text x="430" y="85" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, -apple-system, BlinkMacSystemFont, 'Segoe UI', serif" font-size="62" font-weight="800" letter-spacing="0.22em" fill="url(#textGradient)" filter="url(#textGlow)">NAGRIKAI</text>
</svg>